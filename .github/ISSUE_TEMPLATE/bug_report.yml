name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not paste tokens or private data. Security issues: use private vulnerability reporting (see SECURITY.md)."
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Expected vs actual behavior and steps to reproduce.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: DOP Agent version / commit
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [macOS (launchd), Linux (systemd), Docker, Other]
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Python and Copilot CLI versions
  - type: dropdown
    id: channel
    attributes:
      label: Channel
      options: [Web UI, Slack, Telegram, Driver/integration, Other]
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs (redacted)
      render: text
