name: Feature request
description: Suggest an idea or a new driver
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / use case
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: contrib
    attributes:
      label: Contribution
      options:
        - label: I am willing to send a PR
