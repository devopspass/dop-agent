# GitHub Release only: no PyPI, no container registry.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Run tests
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          python -m pytest tests/
      - name: Build source tarball
        run: |
          name="dop-agent-${GITHUB_REF_NAME}"
          git archive --format=tar.gz --prefix="${name}/" -o "${name}.tar.gz" "${GITHUB_REF_NAME}"
          sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"
      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Section heading forms: "## [0.1.0] - date", "## 0.1.0", "## v0.1.0"
          awk -v v="$version" '
            /^## / {
              if (found) exit
              if (index($0, "[" v "]") || $0 ~ ("^## v?" v "([ ]|$)")) { found = 1; next }
            }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::no CHANGELOG.md section found for ${GITHUB_REF_NAME}"
            exit 1
          fi
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "dop-agent-${GITHUB_REF_NAME}.tar.gz" "dop-agent-${GITHUB_REF_NAME}.tar.gz.sha256" \
            --title "${GITHUB_REF_NAME}" --notes-file release-notes.md --verify-tag
