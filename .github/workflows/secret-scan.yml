name: Secret scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Official image instead of gitleaks-action: the action needs a paid licence key on organisation repos.
      - name: Scan full history
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 \
            detect --source /repo --config /repo/.gitleaks.toml --redact --verbose

  license-check:
    name: license-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check dependency licenses
        run: |
          if [ -f scripts/check_licenses.sh ]; then
            bash scripts/check_licenses.sh
          else
            echo "::warning::scripts/check_licenses.sh not present yet; skipping license check"
          fi
