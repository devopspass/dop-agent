[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dop-agent"
version = "0.1.0"
description = "Chat-driven (Slack, Telegram, Web UI) agent daemon built on the GitHub Copilot SDK"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "github-copilot-sdk==1.0.34",
    "slack-bolt==1.30.0",
    "aiohttp==3.14.5",
    "python-dotenv==1.2.4",
    "pyyaml==6.0.3",
    "croniter==7.0.0",
    "httpx==0.28.1",
    "requests==2.34.2",
    "websocket-client==1.9.2",
    "fastapi==0.163.1",
    "uvicorn[standard]==0.54.0",
    "itsdangerous==2.2.0",
    "mcp==2.3.0",
    "cryptography>=50.0.2",
    "certifi>=2026.11.20",
]

[project.optional-dependencies]
# WARNING: this extra installs PyMuPDF, which is AGPL-3.0 (or Artifex
# commercial licensed). See NOTICE before enabling it.
render = [
    "weasyprint==70.0",
    "pymupdf==1.28.2",
    "pillow==13.0.0",
    "markdown==3.11.3",
    "nh3==0.3.8",
]
voice = ["openai-whisper==20250625"]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "playwright>=1.49",
    "pytest-playwright>=0.6",
]

[tool.setuptools]
py-modules = []
