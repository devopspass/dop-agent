<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>DOP Agent — Login</title>
<meta name="color-scheme" content="dark" />
<meta name="theme-color" content="#1a1d21" />
<link rel="icon" type="image/png" href="/static/icons/logo.png" />
<link rel="stylesheet" href="/static/style.css" />
<link rel="stylesheet" href="/static/light.css" />
<script src="/static/theme.js"></script>
</head>
<body class="login-body">
  <form id="login-form" class="login-box">
    <h1><img src="/static/icons/logo.png" alt="" class="login-logo" /> DOP Agent</h1>
    <input id="password" type="password" placeholder="Password" autofocus required />
    <button type="submit">Sign in</button>
    <p id="error" class="error"></p>
  </form>
  <script src="/static/login.js"></script>
</body>
</html>
